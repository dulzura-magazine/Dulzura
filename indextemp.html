<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulzura Magazine</title>

    <link rel="icon" type="image/png" href="images/favicon3.png">

    <style>

/* -----------------------------
   LOAD DULZURA FONTS
------------------------------ */

@font-face {
    font-family: 'Pinyon Script';
    src: url('fonts/PinyonScript-Regular.woff2') format('woff2');
}

@font-face {
    font-family: 'Noto Serif Display';
    src: url('fonts/NotoSerifDisplay_Condensed-Regular.woff2') format('woff2');
}

@font-face {
    font-family: 'Cormorant Garamond';
    src: url('fonts/CormorantGaramond-Regular.woff2') format('woff2');
}


/* -----------------------------
   GLOBAL
------------------------------ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{
    background:#f8f5f2;
    color:#222;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}


/* -----------------------------
   MAIN CONTENT
------------------------------ */

.container{
    max-width:650px;
    width:100%;
    text-align:center;
}


/* Dulzura logo - same as header */

.container h1{
    font-family:'Pinyon Script', cursive;
    font-size:54px;
    font-weight:400;
    color:#7a0f1d;
    margin-bottom:45px;
}


/* Main title */

.container h2{
    font-family:'Noto Serif Display', serif;
    font-size:38px;
    font-weight:400;
    color:#7a0f1d;
    line-height:1.3;
    margin-bottom:25px;
    text-transform:lowercase;
}


/* Paragraph */

.container p{
    font-family:'Cormorant Garamond', serif;
    font-size:21px;
    line-height:1.7;
    color:#555;
    margin-bottom:15px;
}


/* Button */

.btn{
    display:inline-block;
    margin-top:35px;

    padding:11px 30px;

    background:#7a0f1d;
    color:white;

    font-family:'Noto Serif Display', serif;
    font-size:14px;
    letter-spacing:.08em;
    text-transform:uppercase;

    border-radius:999px;

    text-decoration:none;
    transition:.3s ease;
}


.btn:hover{
    opacity:.8;
}


/* Social */

.social{
    margin-top:45px;
}


.social a{
    font-family:'Noto Serif Display', serif;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;

    color:#555;
    text-decoration:none;

    margin:0 12px;
}


.social a:hover{
    color:#7a0f1d;
}


</style>
</head>

<body>

<div class="container">

    <h1>Dulzura</h1>

    <h2>A New Chapter is Coming</h2>

    <p>
        Dulzura Magazine is currently being reimagined to deliver a more refined editorial experience.
    </p>

    <p>
        We're working behind the scenes on our official launch. Thank you for your patience. We can't wait to welcome you back.
    </p>

    <a href="subscribetemp.html" class="btn">
        Notify Me at Launch
    </a>

    <div class="social">
        <a href="https://www.instagram.com/dulzuramagazine/" target="_blank" rel="noopener">Instagram</a>
        •
        <a href="https://www.tiktok.com/@dulzuramagazine" target="_blank" rel="noopener">TikTok</a>
    </div>

</div>

</body>
</html>
