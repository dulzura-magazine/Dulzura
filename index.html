<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulzura Magazine</title>

    <link rel="icon" type="image/png" href="images/favicon3.png">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f5f2;
    color:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
}


/* Main container */
.container{
    max-width:700px;
    width:100%;
    text-align:center;
}


/* Dulzura logo - matches website header */
.container h1{
    font-family:'Pinyon Script', cursive;
    font-weight:400;
    font-size:72px;
    color:#7a0f1d;
    margin-bottom:18px;
}


/* Main announcement */
.container h2{
    font-family:'Noto Serif Display', serif;
    font-weight:400;
    font-size:28px;
    color:#7a0f1d;
    margin-bottom:30px;
}


/* Paragraph text */
.container p{
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    line-height:1.7;
    color:#555;
    margin-bottom:18px;
}


/* Subscribe button */
.btn{
    display:inline-block;
    margin-top:30px;
    padding:12px 34px;
    background:#7a0f1d;
    color:#fff;
    text-decoration:none;

    font-family:'Noto Serif Display', serif;
    font-size:15px;
    letter-spacing:.05em;
    text-transform:uppercase;

    border-radius:999px;
    transition:.3s;
}


.btn:hover{
    opacity:.85;
}


/* Social links */
.social{
    margin-top:45px;
}


.social a{
    font-family:'Noto Serif Display', serif;
    font-size:14px;
    color:#555;
    text-decoration:none;
    margin:0 12px;
}


.social a:hover{
    color:#7a0f1d;
}


</style>

</head>

<body>

<div class="container">

    <h1>Dulzura</h1>

    <h2>A New Chapter is Coming</h2>

    <p>
        Dulzura Magazine is currently being reimagined to deliver a more refined editorial experience.
    </p>

    <p>
        We're working behind the scenes on our official launch. Thank you for your patience. We can't wait to welcome you back.
    </p>

    <a href="subscribetemp.html" class="btn">
        Notify Me at Launch
    </a>

    <div class="social">
        <a href="https://www.instagram.com/dulzuramagazine/" target="_blank" rel="noopener">Instagram</a>
        •
        <a href="https://www.tiktok.com/@dulzuramagazine" target="_blank" rel="noopener">TikTok</a>
    </div>

</div>

</body>
</html>
