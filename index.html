<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulzura Magazine</title>

    <link rel="icon" type="image/png" href="images/favicon3.png">

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f5f2;
    color:#222;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px;
}

.container,
.temp-container{
    max-width:700px;
    width:100%;
    text-align:center;
}


/* Dulzura logo - same as header */
.temp-logo,
.temp-container h1,
.container h1{
    font-family:'Pinyon Script', cursive;
    font-weight:400;
    font-size:72px;
    color:#7a0f1d;
    letter-spacing:0;
    margin-bottom:20px;
}


/* Main heading */
h2{
    font-family:'Noto Serif Display', serif;
    font-size:26px;
    font-weight:400;
    color:#7a0f1d;
    margin-bottom:28px;
}


p{
    font-family:'Cormorant Garamond', serif;
    font-size:20px;
    line-height:1.7;
    color:#555;
    margin-bottom:18px;
}


/* Burgundy button */
.btn,
.subscribe-submit{
    display:inline-block;
    margin-top:30px;
    padding:12px 32px;
    background:#7a0f1d;
    color:white;
    border:none;
    font-family:'Noto Serif Display', serif;
    font-size:15px;
    letter-spacing:.05em;
    cursor:pointer;
    border-radius:999px;
    text-transform:uppercase;
}


.btn:hover,
.subscribe-submit:hover{
    opacity:.85;
}


/* social links */
.social{
    margin-top:45px;
}


.social a,
.back-link{
    font-family:'Noto Serif Display', serif;
    color:#555;
    text-decoration:none;
    margin:0 12px;
}


.social a:hover,
.back-link:hover{
    color:#7a0f1d;
}


/* subscribe inputs */
.subscribe-form{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}


.subscribe-form input{
    font-family:'Cormorant Garamond', serif;
    font-size:17px;
    padding:12px 16px;
    border:1px solid #bbb;
    background:white;
}


.back-link{
    display:block;
    margin-top:35px;
}

</style>
</head>

<body>

<div class="container">

    <h1>DULZURA</h1>

    <h2>A New Chapter is Coming</h2>

    <p>
        Dulzura Magazine is currently being reimagined to deliver a more refined editorial experience.
    </p>

    <p>
        We're working behind the scenes on our official launch. Thank you for your patience. We can't wait to welcome you back.
    </p>

    <a href="subscribetemp.html" class="btn">
        Notify Me at Launch
    </a>

    <div class="social">
        <a href="https://www.instagram.com/dulzuramagazine/" target="_blank" rel="noopener">Instagram</a>
        •
        <a href="https://www.tiktok.com/@dulzuramagazine" target="_blank" rel="noopener">TikTok</a>
    </div>

</div>

</body>
</html>
